# Cloud Souverain — stack Nextcloud
# Nginx (TLS + CORS) -> Nextcloud (Apache) -> MariaDB / Redis
# Démarrage : docker compose up -d   (depuis le dossier infra/)

name: cloud-souverain

services:
  # Génère un certificat auto-signé au premier lancement (si absent)
  certs:
    image: alpine:3.20
    environment:
      NC_DOMAIN: ${NC_DOMAIN}
    volumes:
      - ./nginx/certs:/certs
      - ./scripts/generate-certs.sh:/generate-certs.sh:ro
    entrypoint: ["sh", "/generate-certs.sh"]
    restart: "no"

  db:
    image: mariadb:11.4
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    restart: unless-stopped
    networks: [backend]

  nextcloud:
    image: nextcloud:31-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${MARIADB_PASSWORD}
      REDIS_HOST: redis
      REDIS_HOST_PASSWORD: ${REDIS_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NC_DOMAIN} localhost
      TRUSTED_PROXIES: 172.30.0.0/24
      OVERWRITEPROTOCOL: https
      # Pas de limite pratique sur la taille des fichiers
      PHP_UPLOAD_LIMIT: 50G
      PHP_MEMORY_LIMIT: 1G
      APACHE_BODY_LIMIT: 0
    volumes:
      - nextcloud:/var/www/html
      - ncdata:/var/www/html/data
      - ./nextcloud/post-installation:/docker-entrypoint-hooks.d/post-installation:ro
    networks: [backend]

  # Tâches de fond Nextcloud (toutes les 5 min)
  cron:
    image: nextcloud:31-apache
    restart: unless-stopped
    entrypoint: /cron.sh
    depends_on: [nextcloud]
    volumes:
      - nextcloud:/var/www/html
      - ncdata:/var/www/html/data
    networks: [backend]

  # Reverse proxy : seul service exposé (port 443)
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      certs:
        condition: service_completed_successfully
      nextcloud:
        condition: service_started
    ports:
      - "${HTTPS_PORT:-443}:443"
    environment:
      NC_DOMAIN: ${NC_DOMAIN}
      SITE_ORIGIN: ${SITE_ORIGIN}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks: [backend]

networks:
  backend:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  db:
  nextcloud:
  # Données utilisateurs. En production : voir docker-compose.nas.yml (montage NFS du NAS Synology)
  ncdata:
